<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Factor Authentication - ZTS</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #3730a3;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #0f172a;
            --text-soft: #64748b;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at bottom left, #e0e7ff, #f8fafc);
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }

        .otp-box {
            background: #fff; width: 100%; max-width: 440px;
            padding: 48px; border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
            text-align: center;
        }

        .otp-head { margin-bottom: 32px; }
        .otp-head i { font-size: 3rem; color: var(--primary); margin-bottom: 20px; }
        .otp-head h1 { font-size: 1.5rem; font-weight: 800; margin: 0; color: var(--text-main); }
        .otp-head p { margin: 8px 0 0; color: var(--text-soft); font-size: 0.9rem; font-weight: 500; }

        .otp-input-area { margin: 32px 0; }
        .otp-input-area input { 
            width: 100%; padding: 18px; border: 2px solid #e2e8f0; border-radius: 12px;
            font-family: 'JetBrains Mono', monospace; font-size: 2rem; font-weight: 800; 
            text-align: center; letter-spacing: 0.5em; box-sizing: border-box; transition: all 0.2s;
            color: var(--primary);
        }
        .otp-input-area input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(55, 48, 163, 0.1); }

        .verify-btn { 
            width: 100%; padding: 16px; background: var(--primary); border: none; border-radius: 12px;
            color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; transition: transform 0.1s;
        }
        .verify-btn:active { transform: scale(0.98); }

        .risk-warning { 
            margin-top: 24px; padding: 12px; background: #fffbeb; border: 1px solid #fef3c7; 
            border-radius: 10px; font-size: 0.8rem; color: #92400e; font-weight: 600; 
            display: none; align-items: center; gap: 8px; text-align: left;
        }

        #errorArea { background: #fef2f2; border: 1px solid #fee2e2; color: #991b1b; padding: 12px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; text-align: center; margin-top: 20px; display: none; }
    </style>
</head>
<body>
    <div class="otp-box">
        <div class="otp-head">
            <i class="fas fa-shield-check"></i>
            <h1>Identity Verification</h1>
            <p>Verification code issued to your registered device.</p>
        </div>

        <div id="offHoursAlert" class="risk-warning">
            <i class="fas fa-clock"></i>
            <span>Policy Alert: Identity challenge triggered by Off-Hours access request.</span>
        </div>

        <div id="errorArea"></div>

        <form id="otpForm">
            <div class="otp-input-area">
                <input type="text" id="otpCode" placeholder="000000" maxlength="6" required autofocus autocomplete="one-time-code">
            </div>
            <button type="submit" class="verify-btn">Verify Identity</button>
        </form>

        <p style="margin-top: 24px; font-size: 0.75rem; color: var(--text-soft);">
            The code expires in <span id="timer">5:00</span>.
        </p>
    </div>

    <script src="/js/app.js?v=1.0.7"></script>
    <script>
        async function checkRisk() {
            const res = await fetch('/api/session');
            const s = await res.json();
            if (s.offHoursLogin) {
                document.getElementById('offHoursAlert').style.display = 'flex';
            }
        }
        checkRisk();

        document.getElementById('otpForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const err = document.getElementById('errorArea');
            err.style.display = 'none';

            const res = await postJSON('/api/verify-otp', {
                code: document.getElementById('otpCode').value
            });

            if (res.success) {
                location.href = res.redirect || '/dashboard';
            } else {
                err.textContent = res.message;
                err.style.display = 'block';
            }
        });

        let timeLeft = 300;
        setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
                const m = Math.floor(timeLeft / 60);
                const s = timeLeft % 60;
                document.getElementById('timer').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
            }
        }, 1000);
    </script>
</body>
</html>

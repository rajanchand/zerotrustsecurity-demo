<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication — ZTS</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--c-bg);
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-head" style="margin-bottom: 24px;">
            <i class="fas fa-shield-check" style="font-size: 2rem; color: var(--c-primary); margin-bottom: 16px;"></i>
            <h1>Verify your identity</h1>
            <p>Enter the code sent to your device</p>
        </div>

        <div id="offHoursAlert" class="error-msg" style="display:none; background: var(--c-warning-soft); color: var(--c-warning); border-color: #fef08a;">
            <i class="fas fa-clock"></i> <span id="offHoursText"></span>
        </div>

        <div id="vpnAlert" class="error-msg" style="display:none;">
            <i class="fas fa-shield-alt"></i> VPN detected. Your risk profile is elevated.
        </div>

        <div id="riskContextBox" class="card" style="display:none; margin: 16px 0; padding: 12px;">
            <div style="font-size: 0.75rem; font-weight: 600; color: var(--c-text-secondary); margin-bottom: 12px; text-transform: uppercase;">
                Verification context
            </div>
            <div id="riskFactorsList" class="factor-list"></div>
            <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--c-border); display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--c-text-secondary);">
                <span>IP: <strong id="ctxIP" style="color: var(--c-text);">—</strong></span>
                <span>Location: <strong id="ctxCountry" style="color: var(--c-text);">—</strong></span>
            </div>
        </div>

        <div id="errorArea"></div>

        <form id="otpForm">
            <div class="form-row text-center" style="margin: 24px 0;">
                <input type="text" id="otpCode" placeholder="000 000" maxlength="6" required autofocus autocomplete="one-time-code" style="font-family: inherit; font-size: 2rem; font-weight: 600; text-align: center; letter-spacing: 0.25em; padding: 12px;">
            </div>
            <button type="submit" class="login-btn" id="verifyBtn">Verify</button>
        </form>

        <p style="text-align: center; margin-top: 24px; font-size: 0.8125rem; color: var(--c-text-secondary);">
            Code expires in <strong id="timer" style="font-variant-numeric: tabular-nums;">5:00</strong>
        </p>
    </div>

    <script src="/js/app.js?v=2.1.0"></script>
    <script>
        async function checkRisk() {
            try {
                const res = await fetch('/api/session');
                const s = await res.json();

                if (s.offHoursLogin || s.isUnusualHours) {
                    const offAlert = document.getElementById('offHoursAlert');
                    offAlert.style.display = 'block';
                    document.getElementById('offHoursText').textContent = `Off-hours access from ${s.loginCountry || 'Unknown Location'}. Risk score adjusted to ${s.risk ? s.risk.score : 0}.`;
                }

                if (s.vpn) {
                    document.getElementById('vpnAlert').style.display = 'block';
                }

                if (s.loginIP || s.loginCountry) {
                    document.getElementById('ctxIP').textContent = s.loginIP || '—';
                    document.getElementById('ctxCountry').textContent = s.loginCountry || '—';
                }

                const factors = s.risk && s.risk.factors ? s.risk.factors : [];
                if (factors.length > 0) {
                    document.getElementById('riskContextBox').style.display = 'block';
                    document.getElementById('riskFactorsList').innerHTML = factors.map(f =>
                        `<div class="factor-item">
                            <span>${f.factor}</span>
                            <span class="factor-points">+${f.points}</span>
                        </div>`
                    ).join('');
                }
            } catch(e) {}
        }
        checkRisk();

        document.getElementById('otpForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const err = document.getElementById('errorArea');
            const btn = document.getElementById('verifyBtn');
            err.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Verifying…';

            const res = await postJSON('/api/verify-otp', {
                code: document.getElementById('otpCode').value
            });

            if (res.success) {
                btn.innerHTML = '✓ Redirecting…';
                location.href = res.redirect || '/dashboard';
            } else {
                err.textContent = res.message;
                err.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = 'Verify';
            }
        });

        let timeLeft = 300;
        var timerInterval = setInterval(function() {
            if (timeLeft > 0) {
                timeLeft--;
                var m = Math.floor(timeLeft / 60);
                var sec = timeLeft % 60;
                const tel = document.getElementById('timer');
                tel.textContent = m + ':' + (sec < 10 ? '0' : '') + sec;
                if (timeLeft <= 30) {
                    tel.style.color = 'var(--c-danger)';
                }
            } else {
                clearInterval(timerInterval);
                const tel = document.getElementById('timer');
                tel.textContent = '0:00';
                tel.style.color = 'var(--c-danger)';
                const btn = document.getElementById('verifyBtn');
                btn.disabled = true;
                btn.innerHTML = 'Expired';
                
                var err = document.getElementById('errorArea');
                err.textContent = 'Code expired. Please sign in again.';
                err.style.display = 'block';
            }
        }, 1000);
    </script>
</body>
</html>

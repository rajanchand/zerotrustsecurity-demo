<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Code - ZTS</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: #f5f5f5;
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }

        .verify-box {
            background: #fff; width: 100%; max-width: 400px;
            padding: 40px; border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 1px solid #e0e0e0;
            text-align: center;
        }

        .verify-box h1 { font-size: 1.3rem; font-weight: 700; margin: 0 0 6px; color: #333; }
        .verify-box .desc { color: #888; font-size: 0.85rem; margin-bottom: 24px; }

        .code-input { 
            width: 100%; padding: 14px; border: 2px solid #ddd; border-radius: 8px;
            font-size: 1.6rem; font-weight: 700; text-align: center; 
            letter-spacing: 0.4em; box-sizing: border-box;
        }
        .code-input:focus { outline: none; border-color: #2563eb; }

        .verify-btn { 
            width: 100%; padding: 12px; background: #2563eb; border: none; border-radius: 6px;
            color: #fff; font-size: 0.9rem; font-weight: 600; cursor: pointer;
            margin-top: 16px;
        }
        .verify-btn:hover { background: #1d4ed8; }
        .verify-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .warning-box { 
            margin-top: 16px; padding: 10px 14px; border-radius: 6px;
            font-size: 0.8rem; font-weight: 500; text-align: left; display: none;
        }
        .warning-yellow { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }
        .warning-red { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }

        #error-msg { 
            background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c;
            padding: 10px; border-radius: 6px; font-size: 0.8rem; text-align: center;
            margin-top: 16px; display: none;
        }

        .risk-info {
            display: none; margin-top: 12px; padding: 12px;
            background: #f8f8f8; border: 1px solid #e0e0e0; border-radius: 8px;
            text-align: left; font-size: 0.8rem;
        }
        .risk-info h4 { font-size: 0.7rem; font-weight: 700; color: #888; text-transform: uppercase; margin: 0 0 8px; }

        .timer { margin-top: 16px; font-size: 0.8rem; color: #888; }
        .timer strong { color: #333; }
    </style>
</head>
<body>
    <div class="verify-box">
        <h1>Enter Verification Code</h1>
        <p class="desc">We sent a 6-digit code to your registered device.</p>

        <div id="alert-off-hours" class="warning-box warning-yellow">
            <strong>Off-hours login:</strong> You are signing in outside normal hours. Extra verification is needed.
        </div>

        <div id="alert-vpn" class="warning-box warning-red">
            <strong>VPN detected:</strong> You seem to be using a VPN or proxy.
        </div>

        <div id="risk-details" class="risk-info">
            <h4>Why you are seeing this</h4>
            <div id="risk-factors-list"></div>
            <div style="margin-top:8px; padding-top:8px; border-top:1px solid #e0e0e0; display:flex; justify-content:space-between; font-size:0.75rem; color:#999;">
                <span>IP: <strong id="ctx-ip" style="color:#333;">—</strong></span>
                <span>Location: <strong id="ctx-country" style="color:#333;">—</strong></span>
            </div>
        </div>

        <div id="error-msg"></div>

        <form id="verify-form">
            <div style="margin: 20px 0;">
                <input type="text" inputmode="numeric" pattern="[0-9]*" id="token-input" class="code-input" placeholder="0 0 0 | 0 0 0" required autofocus autocomplete="one-time-code">
            </div>
            <button type="submit" class="verify-btn">Verify</button>
        </form>

        <div class="timer">
            Code expires in: <strong id="timer-display">5:00</strong>
        </div>
    </div>

    <script src="/js/app.js?v=2.2.1"></script>
    <script>
        // Load session info and show warnings if needed
        async function loadSessionInfo() {
            try {
                var res = await fetch('/api/session');
                var session = await res.json();

                if (session.offHoursLogin || session.isUnusualHours) {
                    var alert = document.getElementById('alert-off-hours');
                    alert.style.display = 'block';
                    alert.innerHTML = '<strong>Off-hours login:</strong> Signing in from ' + (session.loginCountry || 'unknown location') + '. Extra verification needed.';
                }

                if (session.vpn) {
                    document.getElementById('alert-vpn').style.display = 'block';
                }

                if (session.loginIP) document.getElementById('ctx-ip').textContent = session.loginIP;
                if (session.loginCountry) document.getElementById('ctx-country').textContent = session.loginCountry;

                var factors = session.risk && session.risk.factors ? session.risk.factors : [];
                if (factors.length > 0) {
                    document.getElementById('risk-details').style.display = 'block';
                    var list = document.getElementById('risk-factors-list');
                    list.innerHTML = '';
                    
                    factors.forEach(function(f) {
                        var row = document.createElement('div');
                        var prefix = f.points >= 0 ? '+' : '';
                        row.innerHTML = '<span style="color:#555;">' + f.factor + '</span><span style="color:' + (f.points < 0 ? '#16a34a' : '#b91c1c') + '; font-weight:600;">' + prefix + f.points + ' pts</span>';
                        list.appendChild(row);
                    });
                }
            } catch (err) {
                // Silently fail
            }
        }

        // Handle code submission
        async function verifyCode(e) {
            e.preventDefault();
            var errorBox = document.getElementById('error-msg');
            errorBox.style.display = 'none';

            try {
                if (!csrfToken) {
                    var csrfRes = await fetch('/api/csrf-token');
                    var csrfData = await csrfRes.json();
                    if (csrfData && csrfData.csrfToken) csrfToken = csrfData.csrfToken;
                }

                var tokenVal = document.getElementById('token-input').value.replace(/[^0-9]/g, '');

                if (tokenVal.length !== 6) {
                    errorBox.textContent = 'Please enter a valid 6-digit code.';
                    errorBox.style.display = 'block';
                    return;
                }

                var result = await postJSON('/api/verify-otp', {
                    code: tokenVal
                });

                if (result.success) {
                    location.href = result.redirect || '/dashboard';
                } else {
                    errorBox.textContent = result.message || 'Wrong code. Please try again.';
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                errorBox.textContent = 'Server error. Please try again.';
                errorBox.style.display = 'block';
            }
        }

        // Countdown timer
        function startTimer() {
            var seconds = 300;
            var display = document.getElementById('timer-display');
            
            var interval = setInterval(function() {
                if (seconds > 0) {
                    seconds--;
                    var m = Math.floor(seconds / 60);
                    var s = seconds % 60;
                    display.textContent = m + ':' + (s < 10 ? '0' : '') + s;
                    if (seconds <= 30) display.style.color = '#b91c1c';
                } else {
                    clearInterval(interval);
                    display.textContent = 'EXPIRED';
                    display.style.color = '#b91c1c';
                    document.querySelector('.verify-btn').disabled = true;
                    var errorBox = document.getElementById('error-msg');
                    errorBox.textContent = 'Code expired. Go back to login and try again.';
                    errorBox.style.display = 'block';
                }
            }, 1000);
        }

        loadSessionInfo();
        startTimer();

        // format visual input
        document.getElementById('token-input').addEventListener('input', function(e) {
            var input = e.target;
            var oldVal = input.value;
            var cursor = input.selectionStart;
            
            var digitsBeforeCursor = oldVal.substring(0, cursor).replace(/[^0-9]/g, '').length;
            var raw = oldVal.replace(/[^0-9]/g, '').substring(0, 6);
            
            var formatted = '';
            for (var i = 0; i < raw.length; i++) {
                if (i === 3) formatted += ' | ';
                else if (i > 0 && i !== 3) formatted += ' ';
                formatted += raw[i];
            }
            
            if (oldVal !== formatted) {
                input.value = formatted;
                
                var newCursor = 0;
                var digitCount = 0;
                for (var j = 0; j < formatted.length; j++) {
                    if (/[0-9]/.test(formatted[j])) {
                        digitCount++;
                        if (digitCount === digitsBeforeCursor) {
                            newCursor = j + 1;
                            break;
                        }
                    }
                }
                if (digitsBeforeCursor === 0) newCursor = 0;
                input.setSelectionRange(newCursor, newCursor);
            }
        });

        document.getElementById('verify-form').addEventListener('submit', verifyCode);
    </script>
</body>
</html>

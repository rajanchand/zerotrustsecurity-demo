<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roles - ZTS</title>
    <link rel="stylesheet" href="/css/style.css?v=2.5.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f5f5f5; color: #333; margin: 0; padding: 80px 24px 40px; }
        .container { max-width: 1200px; margin: 0 auto; }

        .page-title { margin-bottom: 24px; }
        .page-title h1 { font-size: 1.4rem; font-weight: 700; margin: 0; }
        .page-title p { color: #888; font-size: 0.85rem; margin: 4px 0 0; }

        .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.8rem; color: #888; margin-bottom: 16px; padding: 10px 14px; background: #fff; border-radius: 8px; border: 1px solid #e0e0e0; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .dot-full { background: #16a34a; } .dot-read { background: #2563eb; } .dot-own { background: #d97706; } .dot-none { background: #ddd; }

        .role-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
        .role-card { background: #fff; border-radius: 10px; border: 1px solid #e0e0e0; overflow: hidden; }
        .role-card.yours { border: 2px solid #2563eb; }
        .role-header { padding: 14px 16px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
        .role-header h3 { font-size: 0.95rem; font-weight: 700; margin: 0; }
        .role-header p { font-size: 0.75rem; color: #888; margin: 2px 0 0; }
        .role-badge { padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; background: #f0f0f0; color: #555; }
        .yours-tag { font-size: 0.65rem; background: #2563eb; color: #fff; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }

        .perm-list { padding: 10px 16px; }
        .perm-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 0.8rem; color: #555; border-bottom: 1px solid #fafafa; }
        .perm-item:last-child { border-bottom: none; }
        .perm-label { flex: 1; }
        .perm-badge { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
        .badge-full { background: #dcfce7; color: #166534; } .badge-read { background: #dbeafe; color: #1d4ed8; }
        .badge-own { background: #fef3c7; color: #92400e; } .badge-denied { background: #f5f5f5; color: #999; }
    </style>
</head>
<body>
    <nav class="navbar" style="position:fixed; top:0; width:100%; z-index:1001; background:#fff; border-bottom:1px solid #e0e0e0;">
        <button class="menu-toggle">Menu</button>
        <a href="/dashboard" class="navbar-brand"><span>ZTS</span> Admin</a>
        <div class="nav-menu" id="mainNav"></div>
        <div class="user-menu" id="userMenu"></div>
    </nav>

    <div class="container">
        <div class="page-title">
            <h1>Roles and Permissions</h1>
            <p>What each role can do in the system.</p>
        </div>

        <div class="legend">
            <strong style="color:#333;">Key:</strong>
            <div class="legend-item"><div class="dot dot-full"></div> Full access</div>
            <div class="legend-item"><div class="dot dot-read"></div> Read only</div>
            <div class="legend-item"><div class="dot dot-own"></div> Own data only</div>
            <div class="legend-item"><div class="dot dot-none"></div> No access</div>
        </div>

        <div class="role-grid" id="roleGrid"></div>
    </div>

    <script src="/js/app.js?v=2.5.0"></script>
    <script>
        var ROLES = [
            { key: 'SuperAdmin', badge: 'Full Control', desc: 'Complete access to everything.',
              perms: [
                { label: 'Dashboards', level: 'full', badge: 'Full' },
                { label: 'User management', level: 'full', badge: 'Full' },
                { label: 'Logs and reports', level: 'full', badge: 'Full' },
                { label: 'Device management', level: 'full', badge: 'Full' },
                { label: 'Live monitoring', level: 'full', badge: 'Full' },
                { label: 'Network rules', level: 'full', badge: 'Full' },
                { label: 'Risk settings', level: 'full', badge: 'Full' }
              ]
            },
            { key: 'HR', badge: 'HR', desc: 'Manages user accounts.',
              perms: [
                { label: 'Add/remove users', level: 'full', badge: 'Full' },
                { label: 'User profiles', level: 'full', badge: 'Full' },
                { label: 'Access control', level: 'full', badge: 'Full' },
                { label: 'Dashboard', level: 'read', badge: 'Read' },
                { label: 'System logs', level: 'none', badge: 'No access' },
                { label: 'Network settings', level: 'none', badge: 'No access' }
              ]
            },
            { key: 'IT', badge: 'IT', desc: 'Manages devices and network.',
              perms: [
                { label: 'Device registration', level: 'full', badge: 'Full' },
                { label: 'Network config', level: 'full', badge: 'Full' },
                { label: 'Live monitoring', level: 'full', badge: 'Full' },
                { label: 'User directory', level: 'read', badge: 'Read' },
                { label: 'User authentication', level: 'none', badge: 'No access' }
              ]
            },
            { key: 'Finance', badge: 'Finance', desc: 'Standard finance access.',
              perms: [
                { label: 'Own profile', level: 'own', badge: 'Own only' },
                { label: 'Dashboard', level: 'read', badge: 'Read' },
                { label: 'User management', level: 'none', badge: 'No access' },
                { label: 'System settings', level: 'none', badge: 'No access' }
              ]
            },
            { key: 'CustomerSupport', badge: 'Support', desc: 'Basic support access.',
              perms: [
                { label: 'Own profile', level: 'own', badge: 'Own only' },
                { label: 'Dashboard', level: 'read', badge: 'Read' },
                { label: 'User management', level: 'none', badge: 'No access' },
                { label: 'System settings', level: 'none', badge: 'No access' }
              ]
            }
        ];

        function renderRoles(userRole) {
            var grid = document.getElementById('roleGrid');
            grid.innerHTML = '';

            ROLES.forEach(function(role) {
                var isAdmin = userRole === 'SuperAdmin';
                var isMine = role.key === userRole;
                if (!isAdmin && !isMine) return;

                var permsHtml = role.perms.map(function(p) {
                    var badgeClass = p.level === 'full' ? 'badge-full' : p.level === 'read' ? 'badge-read' : p.level === 'own' ? 'badge-own' : 'badge-denied';
                    return '<div class="perm-item"><div class="dot dot-' + p.level + '"></div><span class="perm-label">' + p.label + '</span><span class="perm-badge ' + badgeClass + '">' + p.badge + '</span></div>';
                }).join('');

                grid.innerHTML += '<div class="role-card ' + (isMine ? 'yours' : '') + '">' +
                    '<div class="role-header"><div><h3>' + role.key + (isMine ? '<span class="yours-tag">You</span>' : '') + '</h3><p>' + role.desc + '</p></div><span class="role-badge">' + role.badge + '</span></div>' +
                    '<div class="perm-list">' + permsHtml + '</div></div>';
            });
        }

        async function loadPage() {
            try {
                var res = await fetch('/api/dashboard-data');
                var data = await res.json();
                buildNavbar(data.user.role, 'portal', data.user.username);
                renderRoles(data.user.role);
            } catch (err) {
                location.href = '/login';
            }
        }

        loadPage();
    </script>
</body>
</html>

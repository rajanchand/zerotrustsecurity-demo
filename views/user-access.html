<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Permissions - ZTS</title>
    <link rel="stylesheet" href="/css/style.css?v=2.5.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f5f5f5; color: #333; margin: 0; padding: 80px 24px 120px; }
        .container { max-width: 1300px; margin: 0 auto; }

        .page-top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; }
        .page-top h1 { font-size: 1.4rem; font-weight: 700; margin: 0; }
        .page-top p { color: #888; font-size: 0.85rem; margin: 4px 0 0; }

        .card { background: #fff; border-radius: 10px; border: 1px solid #e0e0e0; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { padding: 14px 18px; background: #fafafa; color: #888; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; text-align: left; border-bottom: 1px solid #e0e0e0; }
        td { padding: 12px 18px; border-bottom: 1px solid #f5f5f5; font-size: 0.82rem; vertical-align: middle; }
        tr:hover td { background: #fafafa; }
        tr.changed td { background: #fffbeb; }

        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 32px; height: 32px; background: #e0e7ff; color: #2563eb; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; }
        .role-tag { font-size: 0.6rem; font-weight: 600; color: #888; background: #f0f0f0; padding: 2px 6px; border-radius: 3px; }

        .switch { position: relative; display: inline-block; width: 32px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background: #ccc; transition: .2s; border-radius: 18px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background: white; transition: .2s; border-radius: 50%; }
        input:checked + .slider { background: #16a34a; }
        input:checked + .slider:before { transform: translateX(14px); }
        input:disabled + .slider { opacity: 0.3; cursor: not-allowed; }

        .save-bar {
            position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
            background: #1e293b; padding: 12px 24px; border-radius: 50px;
            display: flex; align-items: center; gap: 16px;
            opacity: 0; pointer-events: none; transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .save-bar.show { opacity: 1; pointer-events: auto; }
        .save-bar span { color: #fff; font-size: 0.85rem; font-weight: 600; }
        .save-btn { background: #fff; color: #333; border: none; padding: 8px 18px; border-radius: 50px; font-weight: 700; cursor: pointer; font-size: 0.8rem; }
        .cancel-btn { background: transparent; color: #aaa; border: 1px solid #555; padding: 8px 14px; border-radius: 50px; font-size: 0.75rem; cursor: pointer; }

        .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal { background: #fff; width: 100%; max-width: 380px; border-radius: 12px; padding: 28px; text-align: center; }
        .modal h3 { margin: 0 0 8px; font-size: 1.1rem; }
        .modal p { color: #888; font-size: 0.85rem; margin-bottom: 16px; }
        .modal input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem; text-align: center; box-sizing: border-box; margin-bottom: 12px; }
        .modal-error { color: #dc2626; font-size: 0.8rem; display: none; margin-bottom: 10px; }

        .small-btn { padding: 8px 14px; background: #f5f5f5; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.8rem; }
    </style>
</head>
<body>
    <nav class="navbar" style="position:fixed; top:0; width:100%; z-index:1001; background:#fff; border-bottom:1px solid #e0e0e0;">
        <button class="menu-toggle">Menu</button>
        <a href="/dashboard" class="navbar-brand"><span>ZTS</span> Admin</a>
        <div class="nav-menu" id="mainNav"></div>
        <div class="user-menu" id="userMenu"></div>
    </nav>

    <div class="container">
        <div class="page-top">
            <div><h1>User Permissions</h1><p>Toggle permissions for <span id="accountCount">...</span> users.</p></div>
            <button class="small-btn" onclick="loadUsers()">Refresh</button>
        </div>
        <div class="card">
            <table>
                <thead><tr><th>User</th><th>Create</th><th>Edit</th><th>Delete</th><th>Suspend</th><th>Approve</th><th>Devices</th><th>Network</th><th>Monitor</th><th>Dept</th></tr></thead>
                <tbody id="userTableBody"><tr><td colspan="10" style="text-align:center; padding:60px; color:#aaa;">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>

    <div id="actionBar" class="save-bar">
        <span><span id="pendingCount">0</span> changes</span>
        <button class="save-btn" onclick="saveChanges()">Save</button>
        <button class="cancel-btn" onclick="loadUsers()">Cancel</button>
    </div>

    <div id="reAuthModal" class="modal-bg">
        <div class="modal">
            <h3>Password Required</h3>
            <p>Confirm your password to save changes.</p>
            <input type="password" id="reAuthPassword" placeholder="Password">
            <p id="reAuthError" class="modal-error"></p>
            <div style="display:flex; gap:8px;">
                <button class="save-btn" onclick="confirmPassword()" style="flex:1; background:#2563eb; color:#fff; padding:10px; border-radius:6px;">Submit</button>
                <button class="small-btn" onclick="document.getElementById('reAuthModal').style.display='none'">Cancel</button>
            </div>
        </div>
    </div>

    <div id="toast-box" style="position:fixed; top:20px; right:20px; z-index:3000;"></div>

    <script src="/js/app.js?v=2.5.0"></script>
    <script>
        var PERMS = ['user_create', 'user_edit', 'user_delete', 'user_suspend', 'user_approve', 'device_approve', 'network_manage', 'monitor_live', 'dept_manage'];
        var saved = {};
        var edits = {};
        var cb = null;

        async function initPage() {
            var res = await fetch('/api/session');
            var session = await res.json();
            if (!session.loggedIn) return location.href = '/login';
            buildNavbar(session.user.role, 'user-access', session.user.username);
            await loadUsers();
        }

        async function loadUsers() {
            try {
                var res = await fetch('/api/mapping/permissions');
                var users = await res.json();
                saved = {}; edits = {};
                users.forEach(function(u) { saved[u.id] = JSON.parse(JSON.stringify(u.permissions || {})); });
                document.getElementById('accountCount').textContent = users.length;
                renderTable(users);
                updateBar();
            } catch (err) { console.error(err); }
        }

        function renderTable(users) {
            var tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '';
            users.forEach(function(user) {
                var tr = document.createElement('tr');
                tr.id = 'row-' + user.id;
                var html = '<td><div class="user-info"><div class="user-avatar">' + user.username[0].toUpperCase() + '</div><div><strong>' + user.username + '</strong><br><span class="role-tag">' + user.role + '</span></div></div></td>';
                PERMS.forEach(function(p) {
                    var on = (user.permissions && user.permissions[p] === true) || user.role === 'SuperAdmin';
                    html += '<td style="text-align:center"><label class="switch"><input type="checkbox" onchange="editPerm(' + user.id + ', \'' + p + '\', this.checked)" ' + (on ? 'checked' : '') + '><span class="slider"></span></label></td>';
                });
                tr.innerHTML = html;
                tbody.appendChild(tr);
            });
        }

        function editPerm(id, p, checked) {
            if (!edits[id]) edits[id] = JSON.parse(JSON.stringify(saved[id]));
            edits[id][p] = checked;
            var changed = JSON.stringify(edits[id]) !== JSON.stringify(saved[id]);
            var row = document.getElementById('row-' + id);
            if (changed) { row.classList.add('changed'); } else { row.classList.remove('changed'); delete edits[id]; }
            updateBar();
        }

        function updateBar() {
            var count = Object.keys(edits).length;
            document.getElementById('pendingCount').textContent = count;
            document.getElementById('actionBar').classList.toggle('show', count > 0);
        }

        async function saveChanges() {
            var updates = Object.keys(edits).map(function(id) { return { userId: parseInt(id), permissions: edits[id] }; });
            var res = await postJSON('/api/mapping/permissions/bulk-update', { updates: updates });
            if (res.success) { showToast('Permissions saved', 'success'); setTimeout(function() { location.href = '/mapping'; }, 800); }
            else if (res.requireReAuth) { cb = saveChanges; document.getElementById('reAuthPassword').value = ''; document.getElementById('reAuthModal').style.display = 'flex'; }
            else { showToast(res.message, 'error'); }
        }

        async function confirmPassword() {
            var res = await postJSON('/api/verify-reauth', { password: document.getElementById('reAuthPassword').value });
            if (res.success) { document.getElementById('reAuthModal').style.display = 'none'; if (cb) { cb(); cb = null; } }
            else { var e = document.getElementById('reAuthError'); e.textContent = res.message; e.style.display = 'block'; }
        }

        initPage();
    </script>
</body>
</html>

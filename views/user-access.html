<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Access Dashboard - ZTS</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            /* Premium Light Theme */
            --primary: #4f46e5;
            --primary-light: #eef2ff;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
            --shadow: 0 4px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 100px 20px 40px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.25rem;
            font-weight: 800;
            margin: 0;
            color: var(--text-main);
            letter-spacing: -0.025em;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1rem;
            margin-top: 8px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 0;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            padding: 16px 24px;
            background: #f1f5f9;
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
            vertical-align: middle;
        }

        tr:hover {
            background-color: #fcfcfc;
        }

        .user-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .user-id {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .user-role {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 600;
            background: #f1f5f9;
            color: #475569;
        }

        .role-superadmin { background: #fee2e2; color: #991b1b; }
        .role-it { background: #dcfce7; color: #166534; }
        .role-hr { background: #fef9c3; color: #854d0e; }

        /* Modern Toggle Switch Styling */
        .switch {
            position: relative;
            display: inline-block;
            width: 38px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cbd5e1;
            transition: .3s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--success);
        }

        input:checked + .slider:before {
            transform: translateX(18px);
        }

        input:disabled + .slider {
            opacity: 0.5;
            cursor: not-allowed;
            background-color: #e2e8f0;
        }

        .btn-save {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-save:hover:not(:disabled) {
            background: #4338ca;
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }

        .btn-save:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #toast {
            position: fixed;
            top: 24px;
            right: 24px;
            padding: 16px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            display: none;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2001;
        }

        @keyframes slideIn {
            from { transform: translateX(100%) scale(0.9); opacity: 0; }
            to { transform: translateX(0) scale(1); opacity: 1; }
        }

        .perm-label {
            display: none;
        }

        @media (max-width: 900px) {
            .perm-label { display: inline; font-size: 0.7rem; color: var(--text-muted); }
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container">
        <div class="header">
            <h1>User Access Dashboard</h1>
            <p>Granular Zero-Trust Permissions Management • <span id="userCount">0</span> Accounts</p>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>User Account</th>
                        <th title="Create Users">Create</th>
                        <th title="Edit Users">Edit</th>
                        <th title="Delete Users">Delete</th>
                        <th title="Suspend/Block Users">Suspend</th>
                        <th title="Approve Users">Approve</th>
                        <th title="Approve Devices">Device</th>
                        <th title="Manage Network / IP Rules">Network</th>
                        <th title="Live Monitoring">Monitor</th>
                        <th title="Department CRUD">Dept</th>
                        <th style="text-align: right;">Action</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <!-- Rows injected by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <div id="toast"></div>

    <script src="/js/app.js?v=1.0.2"></script>
    <script>
        const PERM_KEYS = [
            'user_create', 'user_edit', 'user_delete', 'user_suspend', 'user_approve',
            'device_approve', 'network_manage', 'monitor_live', 'dept_manage'
        ];

        async function loadPermissions() {
            try {
                const res = await fetch('/api/mapping/permissions');
                const users = await res.json();
                document.getElementById('userCount').textContent = users.length;
                renderTable(users);
            } catch (err) {
                showToast('Failed to load users', 'error');
            }
        }

        function renderTable(users) {
            const body = document.getElementById('userTableBody');
            body.innerHTML = '';

            users.forEach(user => {
                const tr = document.createElement('tr');
                const perms = user.permissions || {};
                const isSuper = user.role === 'SuperAdmin';
                const initial = user.username.charAt(0).toUpperCase();

                let html = `
                    <td>
                        <div class="user-cell">
                            <div class="avatar">${initial}</div>
                            <div>
                                <span class="user-id">${user.username}</span>
                                <span class="user-role role-${user.role.toLowerCase()}">${user.role}</span>
                            </div>
                        </div>
                    </td>
                `;

                PERM_KEYS.forEach(key => {
                    const checked = (perms[key] === true || isSuper) ? 'checked' : '';
                    const disabledAttr = isSuper ? 'disabled' : '';
                    html += `
                        <td style="text-align: center;">
                            <label class="switch">
                                <input type="checkbox" class="perm-checkbox" 
                                    data-user-id="${user.id}" 
                                    data-perm="${key}" 
                                    ${checked} ${disabledAttr}>
                                <span class="slider"></span>
                            </label>
                        </td>
                    `;
                });

                html += `
                    <td style="text-align: right;">
                        <button class="btn-save" onclick="saveUserPermissions(${user.id})" ${isSuper ? 'disabled' : ''}>
                            <i class="fas fa-check-circle"></i> Save
                        </button>
                    </td>
                `;

                tr.innerHTML = html;
                body.appendChild(tr);
            });
        }

        async function saveUserPermissions(userId) {
            const checkboxes = document.querySelectorAll(`.perm-checkbox[data-user-id="${userId}"]`);
            const permissions = {};
            
            checkboxes.forEach(cb => {
                permissions[cb.dataset.perm] = cb.checked;
            });

            document.getElementById('loadingOverlay').style.display = 'flex';

            try {
                // Using helper from app.js to handle CSRF and responses
                const result = await postJSON('/api/mapping/permissions/update', { userId, permissions });

                if (result.success) {
                    showToast(result.message, 'success');
                } else if (result.requireReAuth) {
                    // Logic from existing mapping.html to handle reauth
                    handleReAuthRequired(() => saveUserPermissions(userId));
                } else {
                    showToast(result.message, 'error');
                }
            } catch (err) {
                showToast('Failed to update permissions', 'error');
            } finally {
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.background = type === 'success' ? 'var(--success)' : 'var(--danger)';
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3500);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            // Need session info for navbar
            const session = await (await fetch('/api/session')).json();
            if (!session.loggedIn) return window.location.href = '/login';
            
            // Function from app.js
            if (typeof buildNavbar === 'function') {
                // Note: user-access isn't a defined page in original app.js mappingActive, 
                // but we handle highlighting via its own check.
                buildNavbar(session.user.role, 'user-access', session.user.username);
            }
            loadPermissions();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Rules - ZTS</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f5f5f5; color: #333; margin: 0; padding: 80px 24px 40px; }
        .container { max-width: 1200px; margin: 0 auto; }

        .page-top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; }
        .page-top h1 { font-size: 1.4rem; font-weight: 700; margin: 0; }
        .page-top p { color: #888; font-size: 0.85rem; margin: 4px 0 0; }

        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
        .stat-box { background: #fff; padding: 16px; border-radius: 8px; border: 1px solid #e0e0e0; }
        .stat-box .label { font-size: 0.65rem; font-weight: 600; color: #999; text-transform: uppercase; }
        .stat-box .value { font-size: 1.5rem; font-weight: 700; margin-top: 4px; }

        .card { background: #fff; border-radius: 10px; border: 1px solid #e0e0e0; overflow: hidden; margin-bottom: 16px; }
        .card-head { padding: 14px 18px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .card-head h3 { margin: 0; font-size: 0.9rem; font-weight: 700; }

        table { width: 100%; border-collapse: collapse; }
        th { padding: 12px 18px; background: #fafafa; color: #888; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; text-align: left; border-bottom: 1px solid #e0e0e0; }
        td { padding: 12px 18px; border-bottom: 1px solid #f5f5f5; font-size: 0.82rem; }
        tr:hover td { background: #fafafa; }

        .badge { padding: 3px 8px; border-radius: 4px; font-size: 0.65rem; font-weight: 600; }
        .badge-allow { background: #dcfce7; color: #166534; }
        .badge-block { background: #fee2e2; color: #991b1b; }

        .btn-row { display: flex; gap: 6px; }
        .small-btn { padding: 6px 12px; border-radius: 4px; border: 1px solid #ddd; background: #fff; font-size: 0.75rem; cursor: pointer; font-weight: 600; }
        .small-btn:hover { background: #f5f5f5; }
        .small-btn.red { color: #dc2626; border-color: #fecaca; }
        .small-btn.red:hover { background: #fef2f2; }

        .btn-primary { padding: 8px 14px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: 600; font-size: 0.8rem; cursor: pointer; }

        .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal { background: #fff; width: 100%; max-width: 420px; border-radius: 12px; padding: 28px; }
        .modal h3 { margin: 0 0 16px; font-size: 1.1rem; font-weight: 700; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; color: #555; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.85rem; box-sizing: border-box; }
        .modal-error { color: #dc2626; font-size: 0.8rem; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>
    <nav class="navbar" style="position:fixed; top:0; width:100%; z-index:1001; background:#fff; border-bottom:1px solid #e0e0e0;">
        <button class="menu-toggle">Menu</button>
        <a href="/dashboard" class="navbar-brand"><span>ZTS</span> Admin</a>
        <div class="nav-menu" id="mainNav"></div>
        <div class="user-menu" id="userMenu"></div>
    </nav>

    <div class="container">
        <div class="page-top">
            <div>
                <h1>Network Rules</h1>
                <p>Manage firewall rules for the system</p>
            </div>
            <button class="btn-primary" onclick="showAddModal()">Add Rule</button>
        </div>

        <div class="stats-row">
            <div class="stat-box"><div class="label">Total Rules</div><div class="value" id="stat-total">0</div></div>
            <div class="stat-box"><div class="label">Allow Rules</div><div class="value" id="stat-allow" style="color:#16a34a">0</div></div>
            <div class="stat-box"><div class="label">Block Rules</div><div class="value" id="stat-block" style="color:#dc2626">0</div></div>
        </div>

        <div class="card">
            <div class="card-head">
                <h3>All Rules</h3>
                <button class="small-btn" onclick="loadRules()">Refresh</button>
            </div>
            <table>
                <thead><tr><th>IP Address</th><th>Action</th><th>Reason</th><th>Created By</th><th>Options</th></tr></thead>
                <tbody id="rulesTable"><tr><td colspan="5" style="text-align:center; padding:32px; color:#aaa;">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>

    <!-- Add Rule Modal -->
    <div id="addModal" class="modal-bg">
        <div class="modal">
            <h3>Add Network Rule</h3>
            <div class="form-group"><label>Target IP Address</label><input type="text" id="rule-ip" placeholder="e.g. 192.168.1.98"></div>
            <div class="form-group"><label>Action</label><select id="rule-action"><option value="allow">Allow</option><option value="block">Block</option></select></div>
            <div class="form-group"><label>Reason</label><input type="text" id="rule-reason" placeholder="e.g. Malicious IP"></div>
            <p id="add-error" class="modal-error"></p>
            <div style="display:flex; gap:10px;">
                <button class="btn-primary" style="flex:1;" onclick="addRule()">Add Rule</button>
                <button class="small-btn" onclick="document.getElementById('addModal').style.display='none'">Cancel</button>
            </div>
        </div>
    </div>

    <div id="toast-box" style="position:fixed; top:20px; right:20px; z-index:3000;"></div>

    <script src="/js/app.js?v=2.2.1"></script>
    <script>
        function showAddModal() {
            document.getElementById('rule-ip').value = '';
            document.getElementById('rule-action').value = 'block';
            document.getElementById('rule-reason').value = '';
            document.getElementById('add-error').style.display = 'none';
            document.getElementById('addModal').style.display = 'flex';
        }

        async function addRule() {
            var err = document.getElementById('add-error');
            err.style.display = 'none';
            var ip = document.getElementById('rule-ip').value;
            if (!ip) { err.textContent = 'IP address is required.'; err.style.display = 'block'; return; }

            var res = await postJSON('/api/network/ip-rules/add', {
                ipAddress: ip,
                action: document.getElementById('rule-action').value,
                reason: document.getElementById('rule-reason').value
            });
            if (res.success) { document.getElementById('addModal').style.display = 'none'; showToast('Rule added', 'success'); loadRules(); }
            else { err.textContent = res.message || 'Error adding rule.'; err.style.display = 'block'; }
        }

        async function deleteRule(id) {
            if (!confirm('Delete this rule?')) return;
            var res = await postJSON('/api/network/ip-rules/delete', { ruleId: id });
            if (res.success) { showToast('Rule deleted', 'success'); loadRules(); }
            else { showToast(res.message || 'Error', 'error'); }
        }

        async function loadRules() {
            try {
                var session = await (await fetch('/api/session')).json();
                if (!session.loggedIn) return location.href = '/login';
                buildNavbar(session.user.role, 'network', session.user.username);

                var res = await fetch('/api/network/ip-rules');
                var rules = await res.json();
                var tbody = document.getElementById('rulesTable');
                tbody.innerHTML = '';

                document.getElementById('stat-total').textContent = rules.length;
                document.getElementById('stat-allow').textContent = rules.filter(function(r) { return r.action.toLowerCase() === 'allow'; }).length;
                document.getElementById('stat-block').textContent = rules.filter(function(r) { return r.action.toLowerCase() === 'block'; }).length;

                if (rules.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:32px; color:#aaa;">No rules yet.</td></tr>';
                    return;
                }

                rules.forEach(function(rule) {
                    var tr = document.createElement('tr');
                    var badge = rule.action.toLowerCase() === 'allow' ? '<span class="badge badge-allow">Allow</span>' : '<span class="badge badge-block">Block</span>';
                    tr.innerHTML = '<td><strong>' + rule.ip_address + '</strong></td>' +
                        '<td>' + badge + '</td>' +
                        '<td>' + (rule.reason || '-') + '</td>' +
                        '<td>' + (rule.created_by_name || 'System') + '</td>' +
                        '<td><button class="small-btn red" onclick="deleteRule(\'' + rule.id + '\')">Delete</button></td>';
                    tbody.appendChild(tr);
                });
            } catch (err) { console.error(err); }
        }

        loadRules();
    </script>
</body>
</html>

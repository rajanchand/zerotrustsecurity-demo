<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Registry - ZTS</title>
    <link rel="stylesheet" href="/css/style.css?v=2.5.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f5f5f5; color: #333; margin: 0; padding: 80px 24px 40px; }
        .container { max-width: 1200px; margin: 0 auto; }

        .page-top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; }
        .page-top h1 { font-size: 1.4rem; font-weight: 700; margin: 0; }
        .page-top p { color: #888; font-size: 0.85rem; margin: 4px 0 0; }

        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .stat-box { background: #fff; padding: 16px; border-radius: 8px; border: 1px solid #e0e0e0; }
        .stat-box .label { font-size: 0.65rem; font-weight: 600; color: #999; text-transform: uppercase; }
        .stat-box .value { font-size: 1.5rem; font-weight: 700; margin-top: 4px; }

        .card { background: #fff; border-radius: 10px; border: 1px solid #e0e0e0; overflow: hidden; margin-bottom: 16px; }
        .card-head { padding: 14px 18px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .card-head h3 { margin: 0; font-size: 0.9rem; font-weight: 700; }

        .pending-item { padding: 18px; border-bottom: 1px solid #f5f5f5; display: flex; justify-content: space-between; align-items: center; }
        .pending-item:last-child { border-bottom: none; }
        .device-info { flex: 1; }
        .device-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 4px; }
        .device-sub { font-size: 0.8rem; color: #888; }
        .device-fp { font-family: monospace; font-size: 0.7rem; background: #f5f5f5; padding: 2px 6px; border-radius: 3px; margin-top: 6px; display: inline-block; }

        table { width: 100%; border-collapse: collapse; }
        th { padding: 12px 18px; background: #fafafa; color: #888; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; text-align: left; border-bottom: 1px solid #e0e0e0; }
        td { padding: 12px 18px; border-bottom: 1px solid #f5f5f5; font-size: 0.82rem; }
        tr:hover td { background: #fafafa; }

        .badge { padding: 3px 8px; border-radius: 4px; font-size: 0.65rem; font-weight: 600; }
        .badge-ok { background: #dcfce7; color: #166534; }
        .badge-wait { background: #fef9c3; color: #854d0e; }

        .small-btn { padding: 6px 12px; border-radius: 4px; border: 1px solid #ddd; background: #fff; font-size: 0.75rem; cursor: pointer; font-weight: 600; }
        .small-btn:hover { background: #f5f5f5; }
        .green-btn { background: #16a34a; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
        .red-btn { background: #dc2626; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }

        .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal { background: #fff; width: 100%; max-width: 400px; border-radius: 12px; padding: 28px; text-align: center; }
        .modal h3 { margin: 0 0 8px; font-size: 1.1rem; }
        .modal p { color: #888; font-size: 0.85rem; margin-bottom: 16px; }
        .modal input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem; text-align: center; box-sizing: border-box; margin-bottom: 16px; }
        .modal-error { color: #dc2626; font-size: 0.8rem; display: none; margin-bottom: 10px; }
    </style>
</head>
<body>
    <nav class="navbar" style="position:fixed; top:0; width:100%; z-index:1001; background:#fff; border-bottom:1px solid #e0e0e0;">
        <button class="menu-toggle">Menu</button>
        <a href="/dashboard" class="navbar-brand"><span>ZTS</span> Admin</a>
        <div class="nav-menu" id="mainNav"></div>
        <div class="user-menu" id="userMenu"></div>
    </nav>

    <div class="container">
        <div class="page-top">
            <div><h1>Device Registry</h1><p>Manage registered user devices</p></div>
            <button class="small-btn" onclick="loadDevices()">Refresh</button>
        </div>

        <div class="stats-row">
            <div class="stat-box"><div class="label">Pending</div><div class="value" id="statPending" style="color:#d97706">0</div></div>
            <div class="stat-box"><div class="label">Approved</div><div class="value" id="statApproved" style="color:#16a34a">0</div></div>
            <div class="stat-box"><div class="label">Total</div><div class="value" id="statTotal">0</div></div>
        </div>

        <div class="card">
            <div class="card-head"><h3>Pending Approvals</h3><span style="font-size:0.7rem; font-weight:600; color:#d97706;">NEEDS ACTION</span></div>
            <div id="pendingList"><div style="padding:40px; text-align:center; color:#aaa;">No pending devices.</div></div>
        </div>

        <div class="card">
            <div class="card-head"><h3>All Devices</h3></div>
            <table>
                <thead><tr><th>User</th><th>Device</th><th>OS</th><th>IP</th><th>Status</th><th>Date</th></tr></thead>
                <tbody id="allDevicesTable"><tr><td colspan="6" style="text-align:center; padding:32px; color:#aaa;">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>

    <div id="reAuthModal" class="modal-bg">
        <div class="modal">
            <h3>Password Required</h3>
            <p>Confirm your password to continue.</p>
            <input type="password" id="reAuthPassword" placeholder="Password">
            <p id="reAuthError" class="modal-error"></p>
            <div style="display:flex; gap:8px;">
                <button class="green-btn" onclick="submitPassword()" style="flex:1; padding:10px;">Submit</button>
                <button class="small-btn" onclick="document.getElementById('reAuthModal').style.display='none'">Cancel</button>
            </div>
        </div>
    </div>

    <div id="toast-box" style="position:fixed; top:20px; right:20px; z-index:3000;"></div>

    <script src="/js/app.js?v=2.5.0"></script>
    <script>
        var actionCallback = null;

        async function initPage() {
            var res = await fetch('/api/session');
            var session = await res.json();
            if (!session.loggedIn) return location.href = '/login';
            buildNavbar(session.user.role, 'register-device', session.user.username);
            await loadDevices();
        }

        async function loadDevices() {
            try {
                var results = await Promise.all([fetch('/api/mapping/devices/pending'), fetch('/api/mapping/devices/all')]);
                var pending = await results[0].json();
                var all = await results[1].json();
                var approved = all.filter(function(d) { return d.approved; });

                document.getElementById('statPending').textContent = pending.length;
                document.getElementById('statApproved').textContent = approved.length;
                document.getElementById('statTotal').textContent = all.length;

                showPending(pending);
                showAll(all);
            } catch (err) { console.error(err); }
        }

        function showPending(devices) {
            var el = document.getElementById('pendingList');
            el.innerHTML = '';
            if (devices.length === 0) { el.innerHTML = '<div style="padding:40px; text-align:center; color:#aaa;">No pending devices.</div>'; return; }

            devices.forEach(function(d) {
                var div = document.createElement('div');
                div.className = 'pending-item';
                div.innerHTML = '<div class="device-info"><div class="device-title">' + (d.username || 'User') + ' - ' + (d.label || 'Device') + '</div><div class="device-sub">IP: <strong>' + d.ip + '</strong> | Location: ' + d.country + ' | OS: ' + d.os + '</div><div class="device-fp">ID: ' + d.fingerprint + '</div></div>' +
                    '<div style="display:flex; gap:8px; align-items:center;">' +
                    '<select id="type-' + d.id + '" style="padding:6px 10px; border:1px solid #ddd; border-radius:4px; font-size:0.8rem;"><option value="Managed">Work Device</option><option value="BYOD">Personal Device</option></select>' +
                    '<button class="green-btn" onclick="approveDevice(\'' + d.id + '\')">Approve</button>' +
                    '<button class="red-btn" onclick="rejectDevice(\'' + d.id + '\')">Reject</button></div>';
                el.appendChild(div);
            });
        }

        function showAll(devices) {
            var tbody = document.getElementById('allDevicesTable');
            tbody.innerHTML = '';
            devices.forEach(function(d) {
                var tr = document.createElement('tr');
                tr.innerHTML = '<td><strong>' + (d.username || '-') + '</strong></td><td style="font-size:0.8rem;">' + (d.label || 'Unknown') + '</td><td>' + (d.os || '-') + '</td><td style="font-family:monospace; font-size:0.8rem;">' + d.ip + '</td><td>' + (d.approved ? '<span class="badge badge-ok">Approved</span>' : '<span class="badge badge-wait">Pending</span>') + '</td><td style="font-size:0.8rem; color:#888;">' + formatDate(d.first_seen) + '</td>';
                tbody.appendChild(tr);
            });
        }

        async function approveDevice(id) {
            try {
                var type = document.getElementById('type-' + id).value;
                var res = await postJSON('/api/mapping/devices/approve', { deviceId: id, trustLevel: type });
                if (res.requireReAuth) { actionCallback = function() { approveDevice(id); }; document.getElementById('reAuthPassword').value = ''; document.getElementById('reAuthModal').style.display = 'flex'; return; }
                showToast(res.message, res.success ? 'success' : 'error');
                await loadDevices();
            } catch (err) { showToast('Error', 'error'); }
        }

        async function rejectDevice(id) {
            if (!confirm('Are you sure you want to reject this device?')) return;
            try {
                var res = await postJSON('/api/mapping/devices/reject', { deviceId: id });
                showToast(res.message, res.success ? 'success' : 'error');
                await loadDevices();
            } catch (err) { showToast('Error', 'error'); }
        }

        async function submitPassword() {
            var res = await postJSON('/api/verify-reauth', { password: document.getElementById('reAuthPassword').value });
            if (res.success) { document.getElementById('reAuthModal').style.display = 'none'; if (actionCallback) { actionCallback(); actionCallback = null; } }
            else { var e = document.getElementById('reAuthError'); e.textContent = res.message; e.style.display = 'block'; }
        }

        initPage();
    </script>
</body>
</html>

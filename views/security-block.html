<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Blocked - ZTS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: #f5f5f5; color: #333;
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 24px;
        }

        .block-card {
            background: #fff; width: 100%; max-width: 440px;
            padding: 48px; border-radius: 12px; border: 1px solid #e0e0e0;
            text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .warning-bar { background: #dc2626; height: 4px; border-radius: 12px 12px 0 0; margin: -48px -48px 32px; }

        .icon-circle { 
            width: 64px; height: 64px; background: #fef2f2; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; margin: 0 auto 20px; color: #dc2626;
        }

        h1 { font-size: 1.3rem; font-weight: 700; margin: 0 0 12px; }
        p { color: #888; font-size: 0.9rem; line-height: 1.5; margin-bottom: 24px; }

        .info-box {
            background: #f8f8f8; border: 1px solid #e0e0e0;
            padding: 14px 16px; border-radius: 8px; text-align: left; margin-bottom: 24px;
        }
        .info-row { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 6px; }
        .info-row:last-child { margin-bottom: 0; }
        .info-row .label { color: #888; }
        .info-row .value { font-weight: 600; color: #333; }

        .back-btn { 
            display: inline-block; width: 100%; padding: 12px; background: #2563eb; color: #fff;
            text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 0.9rem;
            box-sizing: border-box;
        }
        .back-btn:hover { background: #1d4ed8; }

        .footer { margin-top: 24px; font-size: 0.75rem; color: #bbb; }
    </style>
</head>
<body>
    <div class="block-card">
        <div class="warning-bar"></div>
        <div class="icon-circle" style="font-size:1.2rem; font-weight:700;">!</div>
        
        <h1>Your Account is Blocked</h1>
        <p>Access has been temporarily stopped for security reasons. Please contact your administrator.</p>
        
        <div class="info-box">
            <div class="info-row"><span class="label">Status</span><span class="value">Blocked</span></div>
            <div class="info-row"><span class="label">Reason</span><span class="value">Security risk detected</span></div>
            <div class="info-row"><span class="label">What to do</span><span class="value" style="color:#dc2626;">Contact IT support</span></div>
        </div>

        <a href="/logout" class="back-btn">Back to Login</a>
        
        <div class="footer">ZTS Admin Portal</div>
    </div>
</body>
</html>

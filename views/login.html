<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — ZTS</title>
    <meta name="description" content="Sign in to the ZTS Zero Trust Security platform.">
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--c-bg);
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-head">
            <div class="logo">Zero Trust Security</div>
            <h1>Welcome back</h1>
            <p>Sign in to your organisation account</p>
        </div>

        <div id="infoArea"></div>
        <div id="errorArea"></div>

        <form id="loginForm">
            <div class="form-row">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Your username" required autofocus autocomplete="username">
            </div>
            <div class="form-row">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Your password" required autocomplete="current-password">
            </div>
            <button type="submit" class="login-btn" id="loginBtn">Sign in</button>
        </form>

        <div class="footer-note">
            Authorised personnel only. All access is audited under<br>
            <strong>NIST SP 800-207 Zero Trust Architecture</strong>.
        </div>
    </div>

    <script src="/js/app.js?v=2.1.0"></script>
    <script>
        // Show redirect messages
        (function() {
            var params = new URLSearchParams(window.location.search);
            var msg = params.get('msg');
            var messages = {
                'session_expired':  'Your session expired due to inactivity. Please sign in again.',
                'account_blocked':  'Your account has been blocked. Contact your administrator.',
                'off_hours':        'Access is restricted outside business hours. Try again later.',
                'session_invalid':  'Your session was ended — this may be due to a login from another device.',
                'password_changed': 'Password updated. Please sign in with your new credentials.'
            };
            if (msg && messages[msg]) {
                var el = document.getElementById('infoArea');
                el.textContent = messages[msg];
                el.style.display = 'block';
            }
        })();

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var errEl  = document.getElementById('errorArea');
            var infoEl = document.getElementById('infoArea');
            var btn    = document.getElementById('loginBtn');

            errEl.style.display  = 'none';
            infoEl.style.display = 'none';

            btn.disabled   = true;
            btn.innerHTML  = '<span class="spinner"></span> Signing in…';

            var fp = typeof getFingerprint === 'function' ? getFingerprint() : 'unknown';

            var res = await postJSON('/api/login', {
                username:    document.getElementById('username').value,
                password:    document.getElementById('password').value,
                fingerprint: fp
            });

            if (res.success) {
                btn.innerHTML = '✓ Redirecting…';
                location.href = res.redirect || '/dashboard';
            } else {
                btn.disabled  = false;
                btn.innerHTML = 'Sign in';
                errEl.textContent   = res.message;
                errEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>

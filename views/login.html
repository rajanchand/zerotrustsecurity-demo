<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ZTS</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: #f5f5f5;
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }

        .login-box {
            background: #fff; width: 100%; max-width: 400px;
            padding: 40px; border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 1px solid #e0e0e0;
        }

        .login-head { text-align: center; margin-bottom: 28px; }
        .login-head .logo { font-size: 1.4rem; font-weight: 700; color: #333; margin-bottom: 4px; }
        .login-head p { margin: 6px 0 0; color: #888; font-size: 0.85rem; }

        .form-row { margin-bottom: 16px; }
        .form-row label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; color: #555; }
        .form-row input { 
            width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 6px;
            font-size: 0.9rem; box-sizing: border-box;
        }
        .form-row input:focus { outline: none; border-color: #2563eb; }

        .login-btn { 
            width: 100%; padding: 12px; background: #2563eb; border: none; border-radius: 6px;
            color: #fff; font-size: 0.9rem; font-weight: 600; cursor: pointer;
            margin-top: 8px;
        }
        .login-btn:hover { background: #1d4ed8; }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .footer-note { text-align: center; margin-top: 24px; font-size: 0.75rem; color: #999; line-height: 1.5; }

        #error-msg { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; padding: 10px; border-radius: 6px; font-size: 0.8rem; text-align: center; margin-bottom: 16px; display: none; }
        #info-msg { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; padding: 10px; border-radius: 6px; font-size: 0.8rem; text-align: center; margin-bottom: 16px; display: none; }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; vertical-align: middle; margin-right: 6px; animation: spin 0.7s linear infinite; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-head">
            <div class="logo">ZTS Admin Portal</div>
            <p>Sign in to your account</p>
        </div>

        <div id="info-msg"></div>
        <div id="error-msg"></div>

        <form id="login-form">
            <div class="form-row">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter your username" required autofocus>
            </div>
            <div class="form-row">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <div class="footer-note">
            Only authorised staff can access this system.<br>
            All logins are recorded.
        </div>
    </div>

    <script src="/js/app.js?v=2.2.0"></script>
    <script>
        // Check for redirect messages in URL
        function checkUrlParams() {
            var params = new URLSearchParams(window.location.search);
            var code = params.get('msg');
            
            var messages = {
                'session_expired': 'Your session expired. Please sign in again.',
                'account_blocked': 'Your account has been blocked.',
                'off_hours': 'You cannot log in outside working hours.',
                'session_invalid': 'Your session was ended. Please sign in again.',
                'password_changed': 'Password updated. Please sign in with your new password.'
            };
            
            if (code && messages[code]) {
                var box = document.getElementById('info-msg');
                box.textContent = messages[code];
                box.style.display = 'block';
            }
        }

        // Handle login form
        async function handleLogin(e) {
            e.preventDefault();
            
            var errorBox = document.getElementById('error-msg');
            var infoBox = document.getElementById('info-msg');
            var btn = document.querySelector('.login-btn');
            
            errorBox.style.display = 'none';
            infoBox.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Signing in...';

            try {
                var result = await postJSON('/api/login', {
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value,
                    fingerprint: getFingerprint()
                });

                if (result.success) {
                    btn.textContent = 'Success!';
                    location.href = result.redirect || '/dashboard';
                } else {
                    btn.disabled = false;
                    btn.textContent = 'Sign In';
                    errorBox.textContent = result.message || 'Wrong username or password.';
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                btn.disabled = false;
                btn.textContent = 'Sign In';
                errorBox.textContent = 'Could not connect to the server. Try again.';
                errorBox.style.display = 'block';
            }
        }

        checkUrlParams();
        document.getElementById('login-form').addEventListener('submit', handleLogin);
    </script>
</body>
</html>

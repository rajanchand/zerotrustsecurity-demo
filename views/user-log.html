<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Audit Trails - ZTS</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #3730a3;
            --bg: #f8fafc;
            --panel: #ffffff;
            --border: #e2e8f0;
            --text-bold: #0f172a;
            --text-soft: #64748b;
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-bold); margin: 0; padding: 100px 24px 40px; }
        .container { max-width: 1400px; margin: 0 auto; }

        .audit-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 32px; }
        .audit-header h1 { font-size: 2.2rem; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
        .audit-header p { color: var(--text-soft); font-weight: 500; margin-top: 4px; }

        /* Search & Filter Bar */
        .filter-bar { background: #fff; padding: 20px 32px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 24px; display: flex; gap: 16px; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .filter-input { flex: 1; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.9rem; font-weight: 500; }
        .filter-select { padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.85rem; font-weight: 600; background: #fff; }

        /* Audit Table */
        .audit-card { background: #fff; border-radius: 20px; border: 1px solid var(--border); overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; }
        th { padding: 16px 24px; background: #f8fafc; color: var(--text-soft); font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); text-align: left; }
        td { padding: 14px 24px; border-bottom: 1px solid #f1f5f9; font-size: 0.85rem; vertical-align: middle; }
        tr:hover td { background: #fbfcfd; cursor: pointer; }

        .mono { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-soft); }
        .action-pill { padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
        .pill-log { background: #e0e7ff; color: #4338ca; }
        .pill-sec { background: #fee2e2; color: #991b1b; }
        
        .row-expanded { background: #f8fafc !important; }
        .detail-pane { padding: 24px; background: #fdfdfd; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); display: none; }
        .detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .detail-box { font-size: 0.8rem; }
        .detail-box .lab { font-weight: 700; color: var(--text-soft); text-transform: uppercase; font-size: 0.65rem; margin-bottom: 4px; }
        .detail-box .val { font-weight: 600; color: var(--text-bold); }

        pre { background: #f1f5f9; padding: 12px; border-radius: 8px; font-size: 0.75rem; margin: 0; color: #334155; overflow-x: auto; }
    </style>
</head>
<body>
    <nav class="navbar" style="position: fixed; top: 0; width: 100%; z-index: 1001; background: #fff; border-bottom: 1px solid var(--border);">
        <button class="menu-toggle">☰</button>
        <a href="/dashboard" class="navbar-brand"><span>ZTS</span> Zero Trust</a>
        <div class="nav-menu" id="mainNav"></div>
        <div class="user-menu" id="userMenu"></div>
    </nav>

    <div class="container">
        <div class="audit-header">
            <div>
                <h1>Identity Audit Trails</h1>
                <p>NIST SP 800-207 Immutable Event Ledger & Forensic Logs</p>
            </div>
            <button class="btn btn-primary" onclick="loadLogs()"><i class="fas fa-sync"></i> Refresh Ledger</button>
        </div>

        <div class="filter-bar">
            <i class="fas fa-search" style="color: var(--text-soft);"></i>
            <input type="text" id="searchTerm" class="filter-input" placeholder="Search by Principal, Action, IP, or CIDR..." onkeyup="filterLogs()">
            <select id="filterType" class="filter-select" onchange="filterLogs()">
                <option value="all">All Event Types</option>
                <option value="LOGIN">Login Activities</option>
                <option value="MFA">MFA / OTP</option>
                <option value="ADMIN">Administrative</option>
                <option value="NETWORK">Network Changes</option>
            </select>
        </div>

        <div class="audit-card">
            <table id="logTable">
                <thead>
                    <tr>
                        <th>Access Timestamp</th>
                        <th>Principal Identity</th>
                        <th>Event Action</th>
                        <th>Source Node</th>
                        <th style="text-align: right;">Context Flags</th>
                    </tr>
                </thead>
                <tbody id="logBody">
                    <tr><td colspan="5" style="text-align: center; padding: 60px; color: var(--text-soft);"><i class="fas fa-circle-notch fa-spin"></i> Synchronizing with Security Ledger...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="/js/app.js?v=1.0.7"></script>
    <script>
        let allLogs = [];

        async function loadLogs() {
            try {
                const s = await (await fetch('/api/session')).json();
                if (!s.loggedIn || s.user.role !== 'SuperAdmin') return location.href = '/dashboard';
                buildNavbar(s.user.role, 'user-log', s.user.username);

                const res = await fetch('/api/admin/logs/all');
                allLogs = await res.json();
                renderLogs(allLogs);
            } catch (e) {
                console.error('Ledger sync failed:', e);
            }
        }

        function renderLogs(logs) {
            const body = document.getElementById('logBody');
            body.innerHTML = '';
            
            logs.forEach((log, index) => {
                const tr = document.createElement('tr');
                tr.onclick = () => toggleDetail(index);
                
                const isSec = log.event_type && !log.action; // determine if it's from security_events table
                const action = log.action || log.event_type || 'GENERAL_LOG';
                const pillCls = isSec ? 'pill-sec' : 'pill-log';

                tr.innerHTML = `
                    <td class="mono">${formatDate(log.created_at)}</td>
                    <td style="font-weight:700;">${log.username || log.user_id || 'SYSTEM'}</td>
                    <td><span class="action-pill ${pillCls}">${action.replace(/_/g, ' ')}</span></td>
                    <td class="mono">${log.ip || '--'}</td>
                    <td style="text-align: right; color: var(--text-soft); font-size: 0.75rem;">
                        ${log.location || log.country || ''} <i class="fas fa-chevron-down" style="margin-left: 8px; opacity: 0.5;"></i>
                    </td>
                `;
                
                const detailTr = document.createElement('tr');
                detailTr.id = `detail-${index}`;
                detailTr.className = 'detail-pane';
                detailTr.innerHTML = `
                    <td colspan="5">
                        <div class="detail-grid">
                            <div class="detail-box">
                                <div class="lab">Identity Metadata</div>
                                <div class="val">UID: ${log.user_id || 'System'}</div>
                                <div class="val">Node: ${log.ip || 'Internal'}</div>
                                <div class="val">Region: ${log.location || log.country || 'Global'}</div>
                            </div>
                            <div class="detail-box">
                                <div class="lab">Event Classification</div>
                                <div class="val">Source: ${isSec ? 'Security Engine' : 'Activity Ledger'}</div>
                                <div class="val">Ref ID: ${log.id}</div>
                            </div>
                            <div style="grid-column: span 3;">
                                <div class="lab">Raw Payload / Audit Details</div>
                                <pre>${renderJSON(log.details || log.detail || log)}</pre>
                            </div>
                        </div>
                    </td>
                `;
                
                body.appendChild(tr);
                body.appendChild(detailTr);
            });
        }

        function toggleDetail(index) {
            const el = document.getElementById(`detail-${index}`);
            const isVisible = el.style.display === 'table-row';
            
            // close all others
            document.querySelectorAll('.detail-pane').forEach(d => d.style.display = 'none');
            
            if (!isVisible) {
                el.style.display = 'table-row';
            }
        }

        function filterLogs() {
            const term = document.getElementById('searchTerm').value.toLowerCase();
            const type = document.getElementById('filterType').value;
            
            const filtered = allLogs.filter(l => {
                const matchTerm = (l.username || '').toLowerCase().includes(term) || 
                                 (l.action || '').toLowerCase().includes(term) || 
                                 (l.event_type || '').toLowerCase().includes(term) ||
                                 (l.ip || '').toLowerCase().includes(term);
                
                if (type === 'all') return matchTerm;
                
                const action = (l.action || l.event_type || '').toUpperCase();
                if (type === 'LOGIN') return matchTerm && action.includes('LOGIN');
                if (type === 'MFA') return matchTerm && (action.includes('OTP') || action.includes('MFA'));
                if (type === 'ADMIN') return matchTerm && (action.includes('USER_') || action.includes('ROLE_'));
                if (type === 'NETWORK') return matchTerm && action.includes('IP_');
                
                return matchTerm;
            });
            
            renderLogs(filtered);
        }

        loadLogs();
    </script>
</body>
</html>

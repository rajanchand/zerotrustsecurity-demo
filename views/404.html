<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Resource Not Found | ZTS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
</head>
<body>
    <div class="error-card">
        <div class="error-code">404</div>
        <h1>Resource Not Found</h1>
        <p>The requested endpoint does not exist in the Zero Trust Security perimeter. This access attempt has been logged.</p>

        <div class="context-pane">
            <div><span class="label">Path:</span> <span id="reqPath"></span></div>
            <div style="margin-top: 6px;"><span class="label">Policy:</span> DENY_UNKNOWN_ROUTES</div>
            <div style="margin-top: 6px;"><span class="label">Action:</span> Redirecting to secure origin</div>
        </div>

        <a href="/dashboard" class="btn-back"><i class="fas fa-shield-alt"></i> Return to Dashboard</a>

        <div class="footer">
            <i class="fas fa-lock"></i> ZTS Zero Trust Security &middot; NIST SP 800-207
        </div>
    </div>

    <script>
        document.getElementById('reqPath').textContent = window.location.pathname;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - ZTS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f5f5;
            color: #333;
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 24px;
        }

        .error-card {
            background: #fff; width: 100%; max-width: 440px;
            padding: 48px; border-radius: 12px;
            border: 1px solid #e0e0e0; text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .error-code { font-size: 5rem; font-weight: 700; color: #ccc; margin-bottom: 12px; }
        h1 { font-size: 1.3rem; font-weight: 700; margin: 0 0 8px; }
        p { color: #888; font-size: 0.9rem; line-height: 1.5; margin-bottom: 24px; }

        .info-box {
            background: #f8f8f8; border: 1px solid #e0e0e0;
            padding: 12px 16px; border-radius: 8px;
            text-align: left; margin-bottom: 24px;
            font-size: 0.8rem; color: #666;
        }
        .info-box .label { color: #2563eb; font-weight: 600; }

        .back-btn {
            display: inline-block; width: 100%; padding: 12px;
            background: #2563eb; color: #fff; text-decoration: none;
            border-radius: 6px; font-weight: 600; font-size: 0.9rem;
            box-sizing: border-box; text-align: center;
        }
        .back-btn:hover { background: #1d4ed8; }

        .footer { margin-top: 24px; font-size: 0.75rem; color: #bbb; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <p>The page you are looking for does not exist or has been moved.</p>

        <div class="info-box">
            <div><span class="label">Page:</span> <span id="reqPath"></span></div>
        </div>

        <a href="/dashboard" class="back-btn">Go to Dashboard</a>

        <div class="footer">ZTS Admin Portal</div>
    </div>

    <script>
        document.getElementById('reqPath').textContent = window.location.pathname;
    </script>
</body>
</html>

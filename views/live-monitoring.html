<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Monitoring - ZTS</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f5f5f5; color: #333; margin: 0; padding: 80px 24px 40px; }
        .container { max-width: 1400px; margin: 0 auto; }

        .page-top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; }
        .page-top h1 { font-size: 1.4rem; font-weight: 700; margin: 0; }
        .page-top p { color: #888; font-size: 0.85rem; margin: 4px 0 0; }

        .live-tag { display: flex; align-items: center; gap: 6px; font-size: 0.7rem; font-weight: 700; color: #16a34a; background: #dcfce7; padding: 5px 12px; border-radius: 20px; border: 1px solid #bbf7d0; }
        .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #16a34a; }

        .stats-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px; }
        .stat-box { background: #fff; padding: 16px; border-radius: 8px; border: 1px solid #e0e0e0; cursor: pointer; }
        .stat-box:hover { border-color: #2563eb; }
        .stat-box .value { font-size: 1.6rem; font-weight: 700; margin-bottom: 2px; }
        .stat-box .label { font-size: 0.65rem; font-weight: 600; color: #888; text-transform: uppercase; }

        .card { background: #fff; border-radius: 10px; border: 1px solid #e0e0e0; overflow: hidden; }
        .toolbar { padding: 14px 18px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .toolbar .count { font-size: 0.8rem; font-weight: 600; color: #888; }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 12px 18px; background: #fafafa; color: #888; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; border-bottom: 1px solid #e0e0e0; }
        td { padding: 12px 18px; border-bottom: 1px solid #f5f5f5; font-size: 0.82rem; vertical-align: middle; }
        tr:hover td { background: #fafafa; cursor: pointer; }

        .badge { padding: 3px 8px; border-radius: 4px; font-size: 0.65rem; font-weight: 600; text-transform: uppercase; min-width: 60px; text-align: center; display: inline-block; }
        .badge-critical { background: #fee2e2; color: #991b1b; }
        .badge-high { background: #ffedd5; color: #9a3412; }
        .badge-medium { background: #dbeafe; color: #1e40af; }
        .badge-info { background: #f0f0f0; color: #555; }

        .mono { font-family: monospace; font-size: 0.75rem; color: #888; }

        .risk-bar { width: 80px; height: 6px; background: #eee; border-radius: 10px; position: relative; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 8px; }
        .risk-fill { position: absolute; height: 100%; left: 0; top: 0; border-radius: 10px; transition: width 0.4s; }

        .details-row { display: none; background: #fafafa; }
        .details-row.open { display: table-row; }
        .details-content { padding: 24px; border-bottom: 1px solid #eee; }
        .details-grid { display: grid; grid-template-columns: 1fr 1fr 1.5fr; gap: 28px; }
        .details-box h4 { margin: 0 0 12px; font-size: 0.65rem; color: #888; text-transform: uppercase; font-weight: 700; }
        .kv-row { margin-bottom: 8px; display: flex; font-size: 0.82rem; }
        .kv-row .key { color: #888; width: 100px; font-weight: 600; }
        .kv-row .val { color: #333; flex: 1; word-break: break-all; }
        .json-box { background: #f5f5f5; color: #333; padding: 14px; border-radius: 6px; font-size: 0.72rem; font-family: monospace; max-height: 300px; overflow-y: auto; line-height: 1.5; white-space: pre-wrap; border: 1px solid #e0e0e0; }

        .small-btn { padding: 6px 12px; border-radius: 4px; border: 1px solid #ddd; background: #fff; font-size: 0.75rem; cursor: pointer; font-weight: 600; }
        .small-btn:hover { background: #f5f5f5; }

        .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-inner { background: #fff; width: 90%; max-width: 800px; border-radius: 12px; padding: 24px; max-height: 80vh; overflow-y: auto; }

        @media (max-width: 900px) { .stats-row { grid-template-columns: repeat(3, 1fr); } .details-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <nav class="navbar" style="position:fixed; top:0; width:100%; z-index:1001; background:#fff; border-bottom:1px solid #e0e0e0;">
        <button class="menu-toggle">Menu</button>
        <a href="/dashboard" class="navbar-brand"><span>ZTS</span> Admin</a>
        <div class="nav-menu" id="mainNav"></div>
        <div class="user-menu" id="userMenu"></div>
    </nav>

    <div class="container">
        <div class="page-top">
            <div><h1>Live Monitoring</h1><p>Real-time security events</p></div>
            <div class="live-tag"><div class="live-dot"></div><span id="connState">Connecting...</span></div>
        </div>

        <div class="stats-row">
            <div class="stat-box" onclick="showDetailsModal('TOTAL')"><div class="value" id="stat-total">0</div><div class="label">Total Events</div></div>
            <div class="stat-box" onclick="showDetailsModal('CRITICAL')"><div class="value" id="stat-critical" style="color:#dc2626">0</div><div class="label" style="color:#dc2626">Critical</div></div>
            <div class="stat-box" onclick="showDetailsModal('HIGH')"><div class="value" id="stat-high" style="color:#d97706">0</div><div class="label" style="color:#d97706">High Risk</div></div>
            <div class="stat-box" onclick="showDetailsModal('FAILURES')"><div class="value" id="stat-failures">0</div><div class="label">Failed Logins</div></div>
            <div class="stat-box" onclick="showDetailsModal('VPN')"><div class="value" id="stat-vpn" style="color:#2563eb">0</div><div class="label" style="color:#2563eb">VPN Usage</div></div>
        </div>

        <div class="card">
            <div class="toolbar">
                <div class="count"><span id="eventCount">0</span> events</div>
                <div style="display:flex; gap:8px;">
                    <button class="small-btn" id="btn-pause" onclick="togglePause()">Pause</button>
                    <button class="small-btn" onclick="clearFeed()">Clear</button>
                </div>
            </div>
            <div style="max-height:700px; overflow-y:auto;">
                <table>
                    <thead><tr><th style="width:24px;"></th><th style="width:160px;">Time</th><th style="width:90px;">Severity</th><th style="width:180px;">Type</th><th style="width:200px;">User</th><th>Location</th><th style="width:160px;">Risk</th></tr></thead>
                    <tbody id="eventsList"><tr><td colspan="7" style="text-align:center; padding:80px; color:#aaa;">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Details Modal -->
    <div id="detailsModal" class="modal-bg">
        <div class="modal-inner">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <h3 id="modalTitle" style="margin:0;">Details</h3>
                <button class="small-btn" onclick="closeModal()">Close</button>
            </div>
            <table>
                <thead><tr><th>User</th><th>Time</th><th>IP</th><th>Location</th><th>Details</th></tr></thead>
                <tbody id="modalBody"></tbody>
            </table>
        </div>
    </div>

    <div class="zts-footer"><div class="footer-brand">ZTS Admin Portal</div></div>

    <script src="/js/app.js?v=2.2.1"></script>
    <script>
        var events = [];
        var isPaused = false;
        var MAX_EVENTS = 1000;

        async function loadPage() {
            var session = await (await fetch('/api/session')).json();
            if (!session.loggedIn) return location.href = '/login';
            buildNavbar(session.user.role, 'live-monitoring', session.user.username);
            await loadHistory();
            startLiveStream();
        }

        async function loadHistory() {
            try {
                var res = await fetch('/api/monitor/events?limit=300');
                var raw = await res.json();
                events = raw.filter(function(e) { return !(e.details && e.details.path === '/mcp'); });
                renderEvents();
                updateStats();
            } catch (err) { console.error(err); }
        }

        function renderEvents() {
            var tbody = document.getElementById('eventsList'); tbody.innerHTML = '';
            events.forEach(function(e) { addEventRow(tbody, e, false); });
            document.getElementById('eventCount').textContent = events.length;
        }

        function addEventRow(container, evt, toTop) {
            var id = evt.id || Math.random().toString(36).substr(2, 9);
            var score = evt.risk_score || 0;
            var color = score >= 60 ? '#dc2626' : score >= 30 ? '#d97706' : '#16a34a';
            var severity = evt.severity || 'INFO';
            var badgeClass = severity === 'CRITICAL' ? 'badge-critical' : severity === 'HIGH' ? 'badge-high' : severity === 'MEDIUM' ? 'badge-medium' : 'badge-info';
            var details = evt.details || {};

            var tr = document.createElement('tr');
            tr.className = 'log-row';
            tr.onclick = function() { toggleRow(id); };
            tr.innerHTML = '<td style="color:#aaa; font-size:0.7rem;">+</td>' +
                '<td class="mono">' + fmtDate(evt.timestamp || new Date()) + '</td>' +
                '<td><span class="badge ' + badgeClass + '">' + severity + '</span></td>' +
                '<td><span class="mono" style="background:#f0f0f0; padding:2px 6px; border-radius:4px;">' + (evt.event_type || 'SYSTEM') + '</span></td>' +
                '<td><div style="color: #000; font-weight: 700; font-size: 0.85rem;">' + (evt.username || 'System') + '</div>' + (details.role ? '<div style="font-size:0.65rem; color:#666;">' + details.role + '</div>' : '') + '</td>' +
                '<td><div class="mono">' + (evt.ip || '-') + '</div><div style="font-size:0.7rem; color:#2563eb; font-weight:600;">' + (evt.location || 'Unknown') + (details.vpn ? ' <span style="color:#dc2626;">(VPN)</span>' : '') + '</div></td>' +
                '<td><div class="risk-bar"><div class="risk-fill" style="width:' + score + '%; background:' + color + '"></div></div><span class="mono">' + score + '</span></td>';

            var dRow = document.createElement('tr');
            dRow.id = 'details-' + id;
            dRow.className = 'details-row';
            dRow.innerHTML = '<td colspan="7"><div class="details-content"><div class="details-grid">' +
                '<div class="details-box"><h4>User Info</h4>' +
                '<div class="kv-row"><span class="key">User ID</span><span class="val">' + (evt.user_id || '-') + '</span></div>' +
                '<div class="kv-row"><span class="key">Username</span><span class="val">' + (evt.username || '-') + '</span></div>' +
                '<div class="kv-row"><span class="key">IP</span><span class="val">' + (evt.ip || '-') + '</span></div>' +
                '<div class="kv-row"><span class="key">Location</span><span class="val">' + (evt.location || '-') + '</span></div></div>' +
                '<div class="details-box"><h4>Event Info</h4>' +
                '<div class="kv-row"><span class="key">Event ID</span><span class="val">' + id + '</span></div>' +
                '<div class="kv-row"><span class="key">Action</span><span class="val">' + (evt.event_type || '-') + '</span></div>' +
                '<div class="kv-row"><span class="key">Risk</span><span class="val">' + score + '</span></div>' +
                '<div class="kv-row"><span class="key">Device</span><span class="val">' + (details.browser || details.device || 'Unknown') + '</span></div></div>' +
                '<div class="details-box"><h4>Raw Data</h4><pre class="json-box">' + JSON.stringify(details, null, 2) + '</pre></div>' +
                '</div></div></td>';

            if (toTop) { container.prepend(dRow); container.prepend(tr); }
            else { container.appendChild(tr); container.appendChild(dRow); }
        }

        function toggleRow(id) {
            var row = document.getElementById('details-' + id);
            row.classList.toggle('open');
        }

        function fmtDate(str) {
            try { return new Date(str).toLocaleString('en-GB', { hour12: false }); }
            catch (e) { return str; }
        }

        function startLiveStream() {
            var source = new EventSource('/api/monitor/stream');
            source.onopen = function() { document.getElementById('connState').textContent = 'Live'; document.querySelector('.live-dot').style.background = '#16a34a'; };
            source.onmessage = function(msg) {
                try {
                    var data = JSON.parse(msg.data);
                    if (data.type === 'ping' || data.type === 'connected') return;
                    
                    // Filter out noisy system test pings
                    if (data.details && data.details.path === '/mcp') return;

                    if (!isPaused) {
                        events.unshift(data);
                        if (events.length > MAX_EVENTS) events.pop();
                        var tbody = document.getElementById('eventsList');
                        if (tbody.children.length === 1 && tbody.children[0].textContent.indexOf('Loading') >= 0) tbody.innerHTML = '';
                        addEventRow(tbody, data, true);
                        document.getElementById('eventCount').textContent = events.length;
                        updateStats();
                    }
                } catch (e) { console.error(e); }
            };
            source.onerror = function() { document.getElementById('connState').textContent = 'Disconnected'; document.querySelector('.live-dot').style.background = '#dc2626'; };
        }

        function updateStats() {
            var total = events.length;
            var critical = events.filter(function(e) { return e.severity === 'CRITICAL'; }).length;
            var high = events.filter(function(e) { return e.severity === 'HIGH'; }).length;
            var failures = events.filter(function(e) { return String(e.event_type).indexOf('FAIL') >= 0 || String(e.event_type).indexOf('BLOCK') >= 0; }).length;
            var vpn = events.filter(function(e) { return e.event_type === 'VPN_DETECTED'; }).length;

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-critical').textContent = critical;
            document.getElementById('stat-high').textContent = high;
            document.getElementById('stat-failures').textContent = failures;
            document.getElementById('stat-vpn').textContent = vpn;
        }

        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('btn-pause').textContent = isPaused ? 'Resume' : 'Pause';
        }

        function clearFeed() { events = []; renderEvents(); }

        function showDetailsModal(category) {
            var filtered = []; var header = '';
            if (category === 'TOTAL') { filtered = events; header = 'All Events'; }
            else if (category === 'CRITICAL') { filtered = events.filter(function(e) { return e.severity === 'CRITICAL'; }); header = 'Critical Events'; }
            else if (category === 'HIGH') { filtered = events.filter(function(e) { return e.severity === 'HIGH'; }); header = 'High Risk Events'; }
            else if (category === 'FAILURES') { filtered = events.filter(function(e) { return String(e.event_type).indexOf('FAIL') >= 0 || String(e.event_type).indexOf('BLOCK') >= 0; }); header = 'Failed Logins'; }
            else if (category === 'VPN') { filtered = events.filter(function(e) { return e.event_type === 'VPN_DETECTED'; }); header = 'VPN Usage'; }

            document.getElementById('modalTitle').textContent = header;
            var tbody = document.getElementById('modalBody'); tbody.innerHTML = '';
            if (filtered.length === 0) { tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:32px; color:#aaa;">No events found.</td></tr>'; }
            else {
                filtered.forEach(function(e) {
                    var tr = document.createElement('tr');
                    tr.innerHTML = '<td><strong>' + (e.username || 'System') + '</strong></td>' +
                                   '<td class="mono">' + fmtDate(e.timestamp || new Date()) + '</td>' +
                                   '<td class="mono">' + (e.ip || '-') + '</td>' +
                                   '<td><strong style="color:#2563eb; font-size:0.8rem;">' + (e.location || 'Unknown') + '</strong></td>' +
                                   '<td>' + ((e.details && e.details.reason) || e.event_type) + '</td>';
                    tbody.appendChild(tr);
                });
            }
            document.getElementById('detailsModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('detailsModal').style.display = 'none'; }

        loadPage();
    </script>
</body>
</html>
